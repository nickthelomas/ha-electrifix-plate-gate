name: Tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paho-mqtt==2.1.0 onnxruntime==1.22.1 numpy==2.2.6 pillow==11.3.0 pytest
      - run: pytest -q -c companion/pyproject.toml companion/tests
  addon-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: companion/addon/publish.sh /tmp/stage
      - run: docker build -t pg-addon /tmp/stage/electrifix_plate_gate_companion
      - run: docker run --rm --entrypoint sh pg-addon -c 'PYTHONPATH=/app /opt/venv/bin/python3 -c "import plate_gate_companion, paho.mqtt, onnxruntime, numpy, PIL"'
      - run: docker build -f companion/docker/Dockerfile companion
