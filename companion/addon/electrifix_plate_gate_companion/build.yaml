# Base images for a LOCAL Supervisor build. Debian (glibc) because the accuracy benchmark needs
# onnxruntime, which publishes no Alpine (musl) wheels. The image is ~300 MB.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
